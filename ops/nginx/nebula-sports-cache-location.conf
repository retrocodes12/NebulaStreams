location ~ ^/(?:private/[^/]+/streamed|watch-together/hls)/[^/]+/[^/]+/[^/]+\.(?:ts|m4s|aac|mp4)$ {
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache nebula_sports_segments;
    proxy_cache_key $nebula_sports_segment_cache_key;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 10s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 20s;
    proxy_cache_lock_age 20s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass $nebula_sports_skip_segment_cache;
    proxy_no_cache $nebula_sports_skip_segment_cache;
    proxy_ignore_headers Set-Cookie Vary X-Accel-Buffering;
    proxy_hide_header Set-Cookie;

    proxy_buffering on;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    add_header X-Nebula-Cache $upstream_cache_status always;
}
