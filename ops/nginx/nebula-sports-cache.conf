proxy_cache_path /var/cache/nginx/nebula-sports
    levels=1:2
    keys_zone=nebula_sports_segments:32m
    max_size=2g
    inactive=2m
    use_temp_path=off;

map $arg_url $nebula_sports_segment_cache_key {
    ""      "$scheme$request_method$host$request_uri";
    default "$arg_url";
}

map $http_range $nebula_sports_skip_segment_cache {
    ""      0;
    default 1;
}
