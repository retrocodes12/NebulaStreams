<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Nebula Sports</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050608;
      color: #eef2f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .launch {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 48px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 20%, rgba(232, 17, 59, 0.22), transparent 34%),
        linear-gradient(180deg, #101114, #050608 62%);
    }

    .card {
      max-width: 620px;
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 28px 0 10px;
      font-size: 44px;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 26px;
      color: rgba(238, 242, 240, 0.72);
      font-size: 20px;
      line-height: 1.45;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: #e8113b;
      color: white;
      padding: 18px 30px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
    }

    button:focus {
      outline: 4px solid rgba(255, 255, 255, 0.45);
      outline-offset: 5px;
    }
  </style>
</head>
<body>
  <main class="launch">
    <div class="card">
      <img src="largeIcon.png" alt="">
      <h1>Nebula Sports</h1>
      <p>Opening live sports.</p>
      <button id="openButton" type="button">Open</button>
    </div>
  </main>
  <script>
    const appUrl = 'https://nebula.work.gd/watch-together?tv=webos';
    const openButton = document.getElementById('openButton');
    const openApp = () => {
      window.location.replace(`${appUrl}&r=${Date.now()}`);
    };

    openButton.addEventListener('click', openApp);
    openButton.focus();
    setTimeout(openApp, 600);
  </script>
</body>
</html>
